
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - UNIRESERVE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #8b1538;
            --primary-hover: #a01d48;
            --border-color: #e0e0e0;
            --text-color: #333;
            --text-light: #666;
            --white: #fff;
            --error-color: #d32f2f;
            --success-color: #388e3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #ebebeb 100%);
            min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:20px;
            color: var(--text-color);
        }
        .auth-card { background: var(--white); border:1px solid var(--border-color); border-radius:8px; width:100%; max-width:450px; box-shadow:0 2px 16px rgba(0,0,0,.08); padding:30px; }
        h1 { color: var(--primary-color); margin-bottom: 6px; }
        .subtitle { color: var(--text-light); margin-bottom: 24px; line-height: 1.5; }
        .form-group { margin-bottom: 16px; }
        label { display:block; margin-bottom: 8px; font-size:14px; font-weight:600; }
        input { width:100%; padding:12px; border:1px solid var(--border-color); border-radius:4px; }
        input:focus { outline:none; border-color:var(--primary-color); box-shadow:0 0 0 3px rgba(139,21,56,.1); }
        .btn-primary { width:100%; padding:12px; border:0; border-radius:4px; background:var(--primary-color); color:#fff; font-weight:600; cursor:pointer; }
        .btn-primary:hover { background:var(--primary-hover); }
        .error-message,.success-message { display:none; margin-top:14px; padding:10px; border-radius:4px; font-size:13px; }
        .error-message { background:#ffebee; color:var(--error-color); }
        .success-message { background:#e8f5e9; color:var(--success-color); }
        .redirect { margin-top:16px; text-align:center; font-size:14px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your university email address to receive a password reset link.</p>
        <form id="forgot-form" onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="student@graduate.utm.my" required>
            </div>
            <button type="submit" class="btn-primary">Confirm & Send Email</button>
            <div id="forgot-error" class="error-message"></div>
            <div id="forgot-success" class="success-message"></div>
        </form>
        <p class="redirect"><a href="login.html">Back to login</a></p>
    </div>

    <script>
        async function handleForgotPassword(event) {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('email').value.trim();
            const response = await fetch('auth_forgot_password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const result = await response.json();

            if (!response.ok || !result.success) {
                return showMessage('forgot-error', result.message || 'Failed to process request');
            }

            showMessage('forgot-success', result.message);
        }

        function showMessage(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('forgot-error').style.display = 'none';
            document.getElementById('forgot-success').style.display = 'none';
        }
    </script>
</body>
</html>
