<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password - SPACEBOOK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--primary-color:#8b1538;--primary-hover:#a01d48;--border-color:#e0e0e0;--text-color:#333;--text-light:#666;--white:#fff;--error-color:#d32f2f;--success-color:#388e3c}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#f5f5f5 0%,#ebebeb 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text-color)}.auth-card{background:var(--white);border:1px solid var(--border-color);border-radius:8px;width:100%;max-width:450px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:30px}h1{color:var(--primary-color);margin-bottom:6px}.subtitle{color:var(--text-light);margin-bottom:24px}.form-group{margin-bottom:16px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}.password-wrap{position:relative}input{width:100%;padding:12px;border:1px solid var(--border-color);border-radius:4px}.password-wrap input{padding-right:48px}input:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(139,21,56,.1)}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#64748b;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s ease,color .2s ease,transform .2s ease}.password-toggle:hover,.password-toggle:focus-visible{background:rgba(139,21,56,.08);color:var(--primary-color);outline:none}.password-toggle:active{transform:translateY(-50%) scale(.94)}.password-toggle svg{width:20px;height:20px;fill:currentColor}.password-toggle .icon-eye{display:none}.password-toggle .icon-eye-off{display:block}.password-toggle.is-visible .icon-eye{display:block}.password-toggle.is-visible .icon-eye-off{display:none}.password-rules{font-size:12px;color:var(--text-light);line-height:1.5;margin-top:6px}.password-rules .met{color:var(--success-color);font-weight:700}.btn-primary{width:100%;padding:12px;border:0;border-radius:4px;background:var(--primary-color);color:#fff;font-weight:600;cursor:pointer}.btn-primary:hover{background:var(--primary-hover)}.error-message,.success-message{display:none;margin-top:14px;padding:10px;border-radius:4px;font-size:13px}.error-message{background:#ffebee;color:var(--error-color)}.success-message{background:#e8f5e9;color:var(--success-color)}
</style></head>
<body>
<div class="auth-card"><h1>Reset Password</h1><p class="subtitle">Set a new password for your account.</p>
<form id="reset-form" onsubmit="handleResetPassword(event)">
<div class="form-group"><label for="new-password">New Password</label><div class="password-wrap"><input type="password" id="new-password" minlength="8" oninput="updatePasswordRules()" required><button type="button" class="password-toggle" onclick="togglePasswordVisibility('new-password', this)" aria-label="Show password" aria-pressed="false"><svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a17.98 17.98 0 0 1-2.25 3.35"></path><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path><path d="M3 3l18 18"></path><path d="M6.58 6.58C3.95 8.35 2 12 2 12s3.5 8 10 8c1.5 0 2.86-.34 4.05-.88"></path></svg></button></div><div class="password-rules" id="password-rules">Min 8 characters + uppercase + lowercase + number + symbol.</div></div>
<div class="form-group"><label for="confirm-password">Confirm Password</label><div class="password-wrap"><input type="password" id="confirm-password" minlength="8" required><button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirm-password', this)" aria-label="Show password" aria-pressed="false"><svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a17.98 17.98 0 0 1-2.25 3.35"></path><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path><path d="M3 3l18 18"></path><path d="M6.58 6.58C3.95 8.35 2 12 2 12s3.5 8 10 8c1.5 0 2.86-.34 4.05-.88"></path></svg></button></div></div>
<button type="submit" class="btn-primary">Update Password</button><div id="reset-error" class="error-message"></div><div id="reset-success" class="success-message"></div>
</form></div>
<script>
function isStrongPassword(password){return password.length>=8&&/[A-Z]/.test(password)&&/[a-z]/.test(password)&&/[0-9]/.test(password)&&/[^A-Za-z0-9]/.test(password)}
function updatePasswordRules(){const password=document.getElementById('new-password').value;const checks=[{label:'8 characters',met:password.length>=8},{label:'uppercase',met:/[A-Z]/.test(password)},{label:'lowercase',met:/[a-z]/.test(password)},{label:'number',met:/[0-9]/.test(password)},{label:'symbol',met:/[^A-Za-z0-9]/.test(password)}];document.getElementById('password-rules').innerHTML=checks.map(item=>`<span class="${item.met?'met':''}">${item.met?'✓':'○'} ${item.label}</span>`).join(' · ')}
function togglePasswordVisibility(inputId,button){const input=document.getElementById(inputId);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';button.classList.toggle('is-visible',show);button.setAttribute('aria-label',show?'Password visible':'Password hidden');button.setAttribute('aria-pressed',show?'true':'false')}
async function handleResetPassword(event){event.preventDefault();hideMessages();const password=document.getElementById('new-password').value;const confirm=document.getElementById('confirm-password').value;const email=new URLSearchParams(window.location.search).get('email')||'';if(password!==confirm){return showMessage('reset-error','Passwords do not match')}if(!isStrongPassword(password)){updatePasswordRules();return showMessage('reset-error','Password must be at least 8 characters and include uppercase, lowercase, number, and symbol.')}const response=await fetch('../../api/auth/auth_reset_password.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const result=await response.json();if(!response.ok||!result.success){return showMessage('reset-error',result.message||'Password reset failed')}showMessage('reset-success','Password updated successfully. Redirecting to login...');setTimeout(()=>window.location.href='login.php',1000)}function showMessage(id,message){const el=document.getElementById(id);el.textContent=message;el.style.display='block'}function hideMessages(){document.getElementById('reset-error').style.display='none';document.getElementById('reset-success').style.display='none'}
</script></body></html>
