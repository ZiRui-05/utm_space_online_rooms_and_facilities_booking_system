<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password - UNIRESERVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--primary-color:#8b1538;--primary-hover:#a01d48;--border-color:#e0e0e0;--text-color:#333;--text-light:#666;--white:#fff;--error-color:#d32f2f;--success-color:#388e3c}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#f5f5f5 0%,#ebebeb 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text-color)}.auth-card{background:var(--white);border:1px solid var(--border-color);border-radius:8px;width:100%;max-width:450px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:30px}h1{color:var(--primary-color);margin-bottom:6px}.subtitle{color:var(--text-light);margin-bottom:24px}.form-group{margin-bottom:16px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}input{width:100%;padding:12px;border:1px solid var(--border-color);border-radius:4px}input:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(139,21,56,.1)}.btn-primary{width:100%;padding:12px;border:0;border-radius:4px;background:var(--primary-color);color:#fff;font-weight:600;cursor:pointer}.btn-primary:hover{background:var(--primary-hover)}.error-message,.success-message{display:none;margin-top:14px;padding:10px;border-radius:4px;font-size:13px}.error-message{background:#ffebee;color:var(--error-color)}.success-message{background:#e8f5e9;color:var(--success-color)}
</style></head>
<body>
<div class="auth-card"><h1>Reset Password</h1><p class="subtitle">Set a new password for your account.</p>
<form id="reset-form" onsubmit="handleResetPassword(event)">
<div class="form-group"><label for="new-password">New Password</label><input type="password" id="new-password" minlength="8" required></div>
<div class="form-group"><label for="confirm-password">Confirm Password</label><input type="password" id="confirm-password" minlength="8" required></div>
<button type="submit" class="btn-primary">Update Password</button><div id="reset-error" class="error-message"></div><div id="reset-success" class="success-message"></div>
</form></div>
<script>
async function handleResetPassword(event){event.preventDefault();hideMessages();const password=document.getElementById('new-password').value;const confirm=document.getElementById('confirm-password').value;const email=new URLSearchParams(window.location.search).get('email')||'';if(password!==confirm){return showMessage('reset-error','Passwords do not match');}const response=await fetch('../../api/auth/auth_reset_password.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const result=await response.json();if(!response.ok||!result.success){return showMessage('reset-error',result.message||'Password reset failed');}showMessage('reset-success','Password updated successfully. Redirecting to login...');setTimeout(()=>window.location.href='login.html',1000);}function showMessage(id,message){const el=document.getElementById(id);el.textContent=message;el.style.display='block';}function hideMessages(){document.getElementById('reset-error').style.display='none';document.getElementById('reset-success').style.display='none';}
</script></body></html>
